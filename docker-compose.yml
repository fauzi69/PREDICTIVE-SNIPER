version: "3.8"

services:
  # MIMO Predictive Sniper
  sniper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mimo-sniper
    environment:
      - PRIVATE_KEY=${PRIVATE_KEY}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - POLYGON_RPC=${POLYGON_RPC:-https://polygon-rpc.com/}
      - USDC_CONTRACT=${USDC_CONTRACT:-0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174}
      - MIN_MARGIN=${MIN_MARGIN:-0.20}
      - MAX_TRADE_SIZE=${MAX_TRADE_SIZE:-1000}
      - DRY_RUN=${DRY_RUN:-true}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - sniper-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mimo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - sniper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  sniper-network:
    driver: bridge
